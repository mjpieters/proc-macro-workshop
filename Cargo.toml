[package]
name = "proc-macro-workshop"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "workshop"
path = "main.rs"

[dependencies]
bitfield = { path = "bitfield" }
derive_builder = { path = "builder" }
derive_debug = { path = "debug" }
seq = { path = "seq" }
sorted = { path = "sorted" }

[workspace.dependencies]
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = { version = "2.0.105", features = ["extra-traits", "full", "visit", "visit-mut"] }
